<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unicorn Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one reading column; the Lab table is the only wide element and scrolls inside its frame. Dark only, like the ECL decks. */
:root {
  --bg: #12161A; --s1: #181D22; --s2: #1F252B; --line: #2E363D;
  --fg: #ECE6DA; --hd: #F3EEE4; --mut: #8A939B; --gold: #C9A45C;
  --sub: #8FA6BF; --rev: #D98B5F; --ok: #8FB89A;
  --f-d: 'EB Garamond', Georgia, 'Times New Roman', serif;
  --f-b: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --f-m: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-b); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--gold); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-d); font-weight: 500; color: var(--hd); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(34px, 5.4vw, 60px); letter-spacing: -.01em; }
h2 { font-size: 28px; margin: 48px 0 16px; display: flex; align-items: baseline; gap: 12px; }
h3 { font-size: 24px; }
p { margin: 0; }
.mono { font-family: var(--f-m); } .muted { color: var(--mut); }
.eyebrow { font: 500 11px var(--f-m); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: 32px 80px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.end { justify-content: flex-end; }

/* Chrome */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--hd); font: 500 21px var(--f-d); }
.brand:hover { text-decoration: none; }
.mark { font-size: 11px; letter-spacing: .14em; color: var(--gold); border: 1px solid var(--gold); padding: 3px 6px; }
.nav { display: flex; gap: 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.nav a { color: var(--mut); padding: 6px 10px; } .nav a.on, .nav a:hover { color: var(--hd); text-decoration: none; box-shadow: inset 0 -1px 0 var(--gold); }
.demo { font-size: 11px; color: var(--gold); background: var(--s1); border-bottom: 1px solid var(--line); } .demo .wrap { padding-block: 8px; }
.foot { border-top: 1px solid var(--line); color: var(--mut); font: 12px var(--f-m); }
.foot .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 24px; }

.btn { display: inline-block; font: 500 13px var(--f-b); letter-spacing: .02em; background: var(--gold); color: var(--bg); border: 1px solid var(--gold); padding: 9px 16px; cursor: pointer; }
.btn:hover { text-decoration: none; filter: brightness(1.08); } .btn:disabled { opacity: .5; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--gold); cursor: pointer; }
.link:hover { text-decoration: underline; }
input, select, textarea { width: 100%; font: 14px/1.5 var(--f-b); color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 9px 11px; border-radius: 0; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); border-color: var(--gold); }
textarea { resize: vertical; }
.inline { display: inline-flex; gap: 8px; align-items: center; margin-top: 16px; font: 12px var(--f-m); color: var(--mut); } .inline select { width: auto; padding: 4px 8px; }

/* Lab */
.hero { display: grid; gap: 20px; padding-bottom: 8px; }
.hero h1 { font-style: italic; max-width: 16ch; }
.now { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "m m a" "t t a" "b b a"; gap: 2px 16px; max-width: 560px; padding: 16px 20px; border: 1px solid var(--gold); color: var(--fg); }
.now:hover { text-decoration: none; background: var(--s1); }
.now .mono { grid-area: m; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.now strong { grid-area: t; font: 500 24px var(--f-d); color: var(--hd); }
.now .brief-n { grid-area: b; color: var(--mut); text-transform: none; letter-spacing: 0; font-size: 12px; }
.now .arrow { grid-area: a; align-self: center; color: var(--gold); font-size: 20px; }
.path { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 36px; border-top: 1px solid var(--line); }
.stage { padding: 12px 12px 0 0; border-left: 1px solid var(--line); padding-left: 12px; }
.stage:first-child { border-left: 0; padding-left: 0; }
.stage > .mono { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); }
.stage.on > .mono { color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font: 12px var(--f-m); padding: 2px 6px; color: var(--fg); border: 1px solid var(--line); }
.chip.ex { border-color: var(--gold); } .chip.cur { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.chip:hover { text-decoration: none; border-color: var(--fg); }

.queue ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.queue li a { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--fg); }
.queue li a:hover { text-decoration: none; background: var(--s1); }
.queue li strong { font: 500 18px var(--f-d); color: var(--hd); }
.count { font-size: 12px; color: var(--bg); background: var(--gold); padding: 1px 8px; }

.tbl { overflow-x: auto; border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tbody tr:last-child > * { border-bottom: 0; }
thead th { font: 500 11px var(--f-m); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); background: var(--s1); }
tbody th a { font: 500 19px var(--f-d); color: var(--hd); }
tbody th small { display: block; font: 11px var(--f-m); color: var(--mut); }
.lab .dc { text-align: center; padding: 12px 4px; } .lab .dc.cur { background: var(--s1); }
thead .dc.cur { color: var(--gold); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); vertical-align: middle; }
.dot.s1 { background: var(--sub); border-color: var(--sub); } .dot.s2 { background: var(--rev); border-color: var(--rev); } .dot.s3 { background: var(--ok); border-color: var(--ok); }
a.dot:hover { transform: scale(1.3); }
.ladder { display: inline-flex; gap: 3px; vertical-align: middle; } .ladder i { width: 8px; height: 14px; background: var(--s2); border: 1px solid var(--line); } .ladder i.on { background: var(--gold); border-color: var(--gold); }
.move { font: 500 11px var(--f-m); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border: 1px solid currentColor; display: inline-block; }
.m-persevere { color: var(--ok); } .m-narrow { color: var(--sub); } .m-pivot { color: var(--rev); } .m-pause, .move.none { color: var(--mut); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; font: 11px var(--f-m); color: var(--mut); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }

/* Session */
.crumb { font-size: 11px; letter-spacing: .06em; color: var(--mut); margin-bottom: 20px; } .crumb a { color: var(--mut); }
.ph { margin-bottom: 28px; display: grid; gap: 4px; }
.note { margin-top: 12px; font: 12px var(--f-m); color: var(--rev); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; }
.card { background: var(--s1); border: 1px solid var(--line); padding: 22px 24px; display: grid; gap: 12px; justify-items: start; min-width: 0; }
.fields { margin: 4px 0 0; padding: 0; list-style: none; counter-reset: f; width: 100%; }
.fields li { counter-increment: f; display: grid; grid-template-columns: 36px 1fr; padding: 10px 0; border-top: 1px solid var(--line); }
.fields li::before { content: counter(f, decimal-leading-zero); font: 12px var(--f-m); color: var(--gold); grid-row: span 2; padding-top: 3px; }
.fields strong { font-weight: 500; color: var(--hd); } .fields span { color: var(--mut); font-size: 14px; }
.gate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .gate .mono { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); margin-right: 4px; }
.g { font: 12px var(--f-m); border: 1px solid var(--line); padding: 2px 8px; }
.check, .mat { margin: 0; padding: 0; list-style: none; width: 100%; }
.check li { padding: 6px 0 6px 24px; position: relative; } .check li::before { content: ''; position: absolute; left: 0; top: 11px; width: 12px; height: 12px; border: 1px solid var(--gold); }
.mat li { padding: 4px 0; }
.vstat { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.vs { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; background: var(--bg); color: var(--fg); }
.vs:hover { text-decoration: none; background: var(--s1); }
.vs span { font: 500 18px var(--f-d); color: var(--hd); line-height: 1.2; } .vs small { display: block; font: 11px var(--f-m); color: var(--mut); }
.vs em { font-style: normal; font-size: 11px; color: var(--mut); }
.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; font-size: 12px; flex-wrap: wrap; }

/* Venture */
.vh { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.vh > div:first-child { display: grid; gap: 8px; justify-items: start; max-width: 680px; }
.one { font: italic 500 22px/1.35 var(--f-d); color: var(--fg); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 32px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kpis > div { padding: 18px 20px 18px 0; display: grid; gap: 8px; justify-items: start; align-content: start; }
.kpis > div + div { border-left: 1px solid var(--line); padding-left: 20px; }
.kpis .muted { font-size: 13px; }
.big { font-size: 28px; color: var(--hd); } .big span { font-size: 14px; color: var(--mut); }
.briefs h2 { margin-top: 40px; }
.brief { border: 1px solid var(--line); background: var(--s1); margin-bottom: 8px; scroll-margin-top: 80px; }
.brief > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 18px; }
.brief > summary::-webkit-details-marker { display: none; }
.brief > summary:hover { background: var(--s2); }
.sid { font-size: 12px; color: var(--gold); }
.bt strong { display: block; font: 500 20px var(--f-d); color: var(--hd); line-height: 1.2; } .bt small { font: 11px var(--f-m); color: var(--mut); }
.pill { font: 500 11px var(--f-m); letter-spacing: .06em; text-transform: uppercase; color: var(--mut); white-space: nowrap; }
.pill.s1 { color: var(--sub); } .pill.s2 { color: var(--rev); } .pill.s3 { color: var(--ok); }
.bbody { padding: 4px 18px 20px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
.bf { margin: 0; } .bf > div { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.bf dt { font-size: 11px; letter-spacing: .04em; color: var(--mut); padding-top: 3px; } .bf dd { margin: 0; overflow-wrap: anywhere; }
.edit { display: grid; gap: 14px; padding-top: 12px; }
.edit label { display: grid; gap: 4px; } .edit label .mono { font-size: 11px; color: var(--gold); letter-spacing: .04em; } .edit small { color: var(--mut); font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 11px; color: var(--mut); }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hist li { border-left: 2px solid var(--line); padding-left: 14px; opacity: .78; } .hist li > .mono { font-size: 11px; color: var(--mut); }
.fbs { display: grid; gap: 10px; justify-items: start; }
.fb { width: 100%; padding: 12px 16px; background: var(--bg); border-left: 2px solid var(--rev); display: grid; gap: 6px; }
.fb.ok { border-left-color: var(--ok); } .fb .mono { font-size: 11px; letter-spacing: .04em; color: var(--mut); }
.fbempty { font-size: 13px; }
.todo { display: grid; gap: 6px; padding-top: 4px; }
.cb { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; } .cb.ro { cursor: default; }
.cb input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--gold); flex: none; }
.later { margin-top: 16px; } .later > summary { cursor: pointer; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); padding: 10px 0; }
.later[open] > summary { margin-bottom: 8px; }

/* Modal, toast */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 12, .72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .box { width: min(520px, 100%); background: var(--s1); border: 1px solid var(--line); padding: 24px; display: grid; gap: 14px; }
.modal label { display: grid; gap: 6px; font-size: 13px; color: var(--mut); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--hd); color: var(--bg); padding: 10px 18px; font-size: 14px; }
.toast.err { background: var(--rev); }
.err { color: var(--rev); }

@media (max-width: 820px) {
  .path { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stage:nth-child(4) { border-left: 0; padding-left: 0; }
  .grid2 { grid-template-columns: 1fr; }
  .bf > div { grid-template-columns: 1fr; gap: 2px; }
}
@media (max-width: 520px) {
  .path { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stage:nth-child(odd) { border-left: 0; padding-left: 0; } .stage:nth-child(4) { border-left: 1px solid var(--line); padding-left: 12px; }
  .kpis { grid-template-columns: 1fr; } .kpis > div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
  .queue li a { grid-template-columns: 40px 1fr; } .queue li a > :nth-child(3), .queue li a > :nth-child(4) { grid-column: 2; }
  .brief > summary { grid-template-columns: 36px minmax(0, 1fr); } .brief .pill { grid-column: 2; }
  .brand span:last-child { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
#mine { display: contents; }

/* ---------- v2: two tracks, focus, plan ---------- */
:root { --usr: #C9A45C; --prd: #8FA6BF; --oth: #3A434B; --warn: #D98B5F; }
.warn { color: var(--warn) !important; }
.small { font-size: 12px; }
.btn.small { padding: 6px 12px; font-size: 12px; }
.row.between { justify-content: space-between; align-items: flex-end; }
.credo { margin: 0; max-width: 640px; border-left: 2px solid var(--gold); padding: 4px 0 4px 18px; }
.credo p { font: italic 500 21px/1.4 var(--f-d); color: var(--fg); }
.credo cite { display: block; margin-top: 6px; font: normal 11px var(--f-m); letter-spacing: .12em; text-transform: uppercase; color: var(--mut); }
.split { display: inline-flex; width: 72px; height: 8px; background: var(--s2); vertical-align: middle; overflow: hidden; }
.split.big { width: 180px; height: 10px; }
.split i { display: block; height: 100%; } .split .u { background: var(--usr); } .split .p { background: var(--prd); } .split .o { background: var(--oth); }
.split.empty i { background: var(--s2); }
.lab .fc { white-space: nowrap; } .lab .fc small { margin-left: 8px; font-size: 11px; color: var(--mut); }
.lab .tr { font-size: 12px; color: var(--mut); } .lab .tr b { color: var(--hd); font-weight: 500; }
.legend b { color: var(--hd); font-weight: 500; }
.sw { display: inline-block; width: 10px; height: 10px; } .sw.u { background: var(--usr); } .sw.p { background: var(--prd); } .sw.o { background: var(--oth); }
.queue li.pl a { box-shadow: inset 2px 0 0 var(--gold); padding-left: 10px; }
.tk { font: 500 10px var(--f-m); letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border: 1px solid currentColor; flex: none; }
.tk-users { color: var(--usr); } .tk-product { color: var(--prd); } .tk-plan { color: var(--mut); }
.tasks { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 8px; }
.tasks li { display: flex; gap: 10px; align-items: baseline; }
.cbrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.cb { align-items: baseline; } .cb .tk { margin-top: 0; }
.link.small { font-size: 12px; }

.credo-band { margin-top: 28px; padding: 16px 20px; background: var(--s1); border: 1px solid var(--line); display: grid; gap: 12px; }
.credo-band p { font: italic 500 18px/1.4 var(--f-d); } .credo-band cite { font: normal 11px var(--f-m); color: var(--mut); letter-spacing: .1em; text-transform: uppercase; margin-left: 6px; }
.cw { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; } .cw .mono { color: var(--mut); }
.kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 20px; }
.kpis .big span { font-size: 12px; }
.tabs { display: flex; gap: 4px; margin: 32px 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 10px 14px; font: 500 12px var(--f-m); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); white-space: nowrap; }
.tabs a:hover { color: var(--hd); text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--hd); box-shadow: inset 0 -2px 0 var(--gold); }

.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.tcol { background: var(--s1); border: 1px solid var(--line); border-top: 2px solid var(--usr); padding: 20px 22px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.tcol.t-product { border-top-color: var(--prd); }
.tcol header { display: grid; gap: 4px; justify-items: start; } .tcol header .btn { margin-top: 8px; }
.t-product .eyebrow { color: var(--prd); }
.totals { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.totals div { background: var(--bg); padding: 10px 12px; display: grid; gap: 2px; }
.totals dt { font-size: 12px; color: var(--mut); } .totals dd { margin: 0; font-size: 22px; color: var(--hd); }
.tlog { list-style: none; margin: 0; padding: 0; display: grid; }
.tlog li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.tlog li.muted { display: block; } .tlog .mono { font-size: 11px; color: var(--mut); } .tlog b { color: var(--hd); font-weight: 500; }
.focus { margin-top: 16px; justify-items: stretch; }
.weeks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; height: 180px; align-items: end; padding-top: 8px; }
.wk { display: grid; grid-template-rows: 1fr auto auto; height: 100%; align-items: end; justify-items: center; gap: 4px; }
.wk .stack { width: 100%; max-width: 44px; display: flex; flex-direction: column; min-height: 2px; background: var(--s2); }
.wk .stack i { display: block; } .wk .u { background: var(--usr); } .wk .p { background: var(--prd); } .wk .o { background: var(--oth); }
.wk > .mono { font-size: 11px; color: var(--mut); } .wk small { font-size: 10px; color: var(--mut); }
.wk.cur > .mono { color: var(--gold); }
.ready { margin-top: 16px; justify-items: stretch; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.checks li { background: var(--bg); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.checks i { flex: none; width: 18px; height: 18px; border: 1px solid var(--line); display: grid; place-items: center; font: normal 12px var(--f-m); color: var(--bg); }

async function publish(source = SOURCE, name = 'index.html') {
  const own = (await KV.get('review-fb')) || [], ts = new Date().toISOString();
  const cur = [...own].reverse().find(e => e.type === 'course')?.value || PUB.current;
  const ventures = [];
  for (const v of PUB.ventures) {
    const fb = mergeLogs(await publishedFor(v.id, CODES[v.id]), own.filter(e => e.team === v.id && e.type === 'feedback'));
    ventures.push({ id: v.id, blob: await seal({ fb }, CODES[v.id]) });
  }
  const data = { ...PUB, current: cur, published: ts, ventures };
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  if (!/<script id="ecl-data" type="application\/json">/.test(source)) { toast('This is not a Unicorn Logbook page.', true); return; }
  const html = source.replace(/(<script id="ecl-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
  saveFile(name, html, 'text/html');
  await KV.set('review-published', ts); INFO.published = ts; INFO.pending = 0; render();
  toast('index.html downloaded. Upload it to GitHub to publish the feedback.');
}

async function load(silent) {
  try {
    const res = await api({ action: 'read', code: me?.code || '', adminKey: admin?.key || '' });
    if (!res.ok) throw new Error(res.error || 'Access denied');
    DB = { ventures: res.ventures || [], log: res.log || [] };
    if (me && !admin) { const mine = (await KV.get('log-' + me.vid)) || []; INFO = { exported: await KV.get('exported-' + me.vid), changed: mine.filter(e => e.type !== 'draft').reduce((m, e) => e.ts > m ? e.ts : m, '') }; }
    if (admin) { const subs = (await KV.get('review-subs')) || {}, own = (await KV.get('review-fb')) || [], pub = await KV.get('review-published');
      INFO = { subs, pending: own.filter(e => !pub || e.ts > pub).length, published: pub }; }
    if (me && !admin && !DB.ventures.some(v => v.id === me.vid)) { me = null; store.set('ecl-me', null); }
    DB.log.forEach(e => { e.value = String(e.value ?? '').replace(/^'(?=[=+\-@])/, ''); e.key = String(e.key); });
    index(); render();
  } catch (e) { if (!silent) $('#main').innerHTML = `<p class="err">Could not load data. ${esc(e.message)}</p>`; }
}
function index() {
  IDX = {}; HIST = {};
  for (const e of DB.log) { const k = e.team + '|' + e.type + '|' + e.key; IDX[k] = e; (HIST[k] = HIST[k] || []).push(e); }
}
const get = (team, type, key) => IDX[team + '|' + type + '|' + key];
const J = (e, d = null) => { try { return e ? JSON.parse(e.value) : d; } catch { return d; } };

async function write(type, team, key, value) {
  const v = typeof value === 'string' ? value : JSON.stringify(value);
  const res = await api({ action: 'write', type, team, key, value: v });
  if (!res.ok) { toast(res.error || 'Not saved', true); return false; }
  DB.log.push({ ts: res.ts || new Date().toISOString(), team, type, key, value: v, author: res.author || '' }); index();
  if (me && !admin && type !== 'draft') INFO.changed = res.ts; if (admin) INFO.pending = (INFO.pending || 0) + 1;
  return true;
}

/* ---------- Derived data ---------- */
const vById = id => DB.ventures.find(v => v.id === id);
const profile = v => ({ venture: v.venture, oneLiner: '', ...(J(get(v.id, 'profile', 'profile')) || {}) });
const current = () => get('_course', 'course', 'current')?.value || C.current || SIDS[0];
// Sessions up to the current one are released to founders; reviewers see all.
const released = sid => !!admin || SIDS.indexOf(sid) <= SIDS.indexOf(current());
const chip = (s, cur) => `<a href="#/s/${s}" class="chip${s === cur ? ' cur' : ''}${C.sessions[s].exam ? ' ex' : ''}${released(s) ? '' : ' lock'}"${released(s) ? '' : ' title="Opens with the session"'}>${s.slice(1)}</a>`;
const canEdit = id => (me && me.vid === id) || admin?.role === 'lecturer';
const stageOf = sid => C.path.find(p => p.sessions.includes(sid));
const fmt = ts => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
const fmtDay = s => { const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }); };
const ago = ts => { if (!ts) return '—'; const h = (Date.now() - new Date(ts)) / 36e5; return h < 1 ? 'just now' : h < 24 ? Math.floor(h) + ' h ago' : Math.floor(h / 24) + ' d ago'; };
// One feedback thread per brief: the lecturer gives the verdict, Odoo may add comments (legacy '#odoo' keys included).
const feedbacks = (vid, key) => [...(HIST[vid + '|feedback|' + key] || []), ...(HIST[vid + '|feedback|' + key + '#odoo'] || [])].sort((a, z) => a.ts < z.ts ? -1 : 1);
const WHO = { Lecturer: 'Prof. Petzold', Odoo: 'Verena Göttlich · Odoo' };
const verdictOf = (vid, key) => { const f = feedbacks(vid, key).filter(x => x.author === 'Lecturer' && (J(x, {}) || {}).verdict).pop(); return f ? { ts: f.ts, v: J(f, {}).verdict } : null; };
const ladderOf = vid => +(get(vid, 'ladder', 'ladder')?.value) || 0;
const kindOf = id => KINDS.find(k => k.id === id) || { id, label: id, unit: '', track: 'users' };
function status(vid, sid) {
  const b = get(vid, 'brief', sid);
  if (!b) return { cls: 's0', t: 'open' };
  const lect = verdictOf(vid, sid);
  if (lect && lect.ts >= b.ts) return lect.v === 'ready' ? { cls: 's3', t: 'accepted' } : { cls: 's2', t: 'revise' };
  if (feedbacks(vid, sid).some(f => f.ts >= b.ts)) return { cls: 's1', t: 'commented' };
  return lect ? { cls: 's1', t: 'resubmitted' } : { cls: 's1', t: 'submitted' };
}
// Draft: saved to the server under the founder's code (any device), invisible to reviewers until submitted.
const draftOf = (vid, sid) => { const d = get(vid, 'draft', sid), b = get(vid, 'brief', sid); return d && (!b || d.ts > b.ts) ? d : null; };
function lastActivity(vid) { let m = ''; for (const e of DB.log) if (e.team === vid && e.ts > m) m = e.ts; return m; }
function traction(vid) {
  const items = [], totals = {}; KINDS.forEach(k => totals[k.id] = 0);
  const seen = {};
  for (const e of DB.log) if (e.team === vid && e.type === 'trac') seen[e.key] = e;
  for (const e of Object.values(seen)) { const v = J(e); if (!v || v.deleted) continue; items.push({ key: e.key, ...v }); totals[v.kind] = (totals[v.kind] || 0) + (+v.n || 0); }
  items.sort((a, z) => (z.date || '').localeCompare(a.date || ''));
  return { items, totals };
}
function focus(vid, weeks = lastWeeks(8)) {
  return weeks.map(w => { const v = J(get(vid, 'week', w)) || null; return { w, v, sum: v ? (+v.users || 0) + (+v.product || 0) + (+v.other || 0) : 0 }; });
}
function focusShare(vid, n = 4) {
  let u = 0, p = 0, o = 0; focus(vid, lastWeeks(n)).forEach(x => { if (x.v) { u += +x.v.users || 0; p += +x.v.product || 0; o += +x.v.other || 0; } });
  const s = u + p + o; return s ? { u: u / s * 100, p: p / s * 100, o: o / s * 100, hours: s } : null;
}
function readiness(vid) {
  const t = traction(vid).totals;
  return C.demoDay.checks.map(c => {
    let ok = false, note = '';
    if (c.briefs) { const st = c.briefs.map(s => status(vid, s)); ok = st.every(x => x.cls === 's3'); note = c.briefs.map((s, i) => `${s} ${st[i].t}`).join(' · '); }
    else if (c.ladder) { const l = ladderOf(vid); ok = l >= c.ladder; note = l ? C.ladder[l - 1] : 'no evidence logged'; }
    else if (c.traction) { const n = t[c.traction[0]] || 0; ok = n >= c.traction[1]; note = `${n} of ${c.traction[1]} Odoo milestones`; }
    return { ...c, ok, note };
  });
}
function planData(v) {
  const vid = v.id;
  const sections = C.plan.map(sec => {
    const fields = sec.from.map(([sid, i]) => {
      const s = C.sessions[sid], vals = J(get(vid, 'brief', sid), []) || [];
      const text = (vals[i] || '').trim();
      return { sid, i, label: s.brief.fields[i][0], text, accepted: status(vid, sid).cls === 's3' && !!text };
    });
    return { ...sec, fields };
  });
  const all = sections.flatMap(s => s.fields);
  const filled = all.filter(f => f.text).length, accepted = all.filter(f => f.accepted).length;
  return { sections, pct: Math.round(filled / all.length * 100), acceptedPct: Math.round(accepted / all.length * 100), filled, total: all.length };
}
function para(t) { return esc(t).split('\n').map(l => l.trim() ? inl(l) : '').join('<br>'); }
function inl(s) { return s.replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
const num = n => Number(n || 0).toLocaleString('en-GB');
function toast(msg, err) {
  const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.setAttribute('role', 'status'); d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}
function modal(title, fields, ok = 'Save', intro = '') {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<form class="box"><h3>${esc(title)}</h3>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}${fields.map((f, i) => `<label for="m-${i}"><span>${esc(f.label)}</span>${f.options
      ? `<select id="m-${i}" name="${f.name}">${f.options.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(f.value) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
      : f.area ? `<textarea id="m-${i}" name="${f.name}" rows="5">${esc(f.value || '')}</textarea>`
      : `<input id="m-${i}" name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}"${f.type === 'number' ? ' min="0" step="any" inputmode="decimal"' : ''} autocomplete="off">`}</label>`).join('')}
      <div class="row end"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn">${esc(ok)}</button></div></form>`;
    document.body.appendChild(d); d.querySelector('input,select,textarea')?.focus();
    const close = v => { d.remove(); res(v); };
    d.querySelector('[data-x]').onclick = () => close(null);
    d.onclick = e => { if (e.target === d) close(null); };
    d.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
    d.querySelector('form').onsubmit = e => { e.preventDefault(); close(Object.fromEntries(new FormData(e.target))); };
  });
}

/* ---------- Small components ---------- */
const ladderBar = n => `<span class="ladder" title="${esc(C.ladder[n - 1] || 'No evidence yet')}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
const movePill = m => m ? `<span class="move m-${esc(m.move)}">${esc((C.moves.find(x => x.id === m.move) || {}).label || m.move)}</span>` : '<span class="move none">—</span>';
const tag = t => `<span class="tk tk-${t}">${t === 'users' ? 'Users' : t === 'product' ? 'Product' : 'Plan'}</span>`;
function splitBar(f, big) {
  if (!f) return `<span class="split${big ? ' big' : ''} empty" title="No hours logged"><i style="width:100%"></i></span>`;
  return `<span class="split${big ? ' big' : ''}" title="Users ${Math.round(f.u)}% · Product ${Math.round(f.p)}% · Other ${Math.round(f.o)}%"><i class="u" style="width:${f.u}%"></i><i class="p" style="width:${f.p}%"></i><i class="o" style="width:${f.o}%"></i></span>`;
}
const onTarget = f => f && f.u + f.p >= C.focusTarget;

/* ---------- Views ---------- */
function vLab() {
  const cur = current(), cs = C.sessions[cur];
  const head = `<section class="hero"><p class="eyebrow">${esc(C.course)} · ${esc(C.term)}</p><h1>${esc(C.claim)}</h1>
    <blockquote class="credo"><p>${credoHTML()}</p><cite>${credoCite()}</cite></blockquote>
    <a class="now" href="#/s/${cur}"><span class="mono">Now · ${cur} · ${esc(cs.date)}</span><strong>${esc(cs.title)}</strong><span class="mono brief-n">${esc(cs.brief.name)}</span><span class="arrow" aria-hidden="true">→</span></a>
    ${admin?.role === 'lecturer' ? `<label class="inline" for="setcur">Current session · released to students with the next publish <select id="setcur" data-act="setcur">${SIDS.map(s => `<option${s === cur ? ' selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}</section>`;

  const path = `<section class="path" aria-label="Odoo pathway">${C.path.map(p => `<div class="stage${p.sessions.includes(cur) ? ' on' : ''}">
    <span class="mono">${esc(p.name)}</span><div class="chips">${p.sessions.map(s => chip(s, cur)).join('')}</div></div>`).join('')}</section>`;

  const queue = admin ? (() => {
    // Lecturer: every submitted brief without a newer verdict. Odoo: briefs of Odoo-led sessions and plans without a newer Odoo comment.
    const q = [], me2 = ROLE_NAME[admin.role], odoo = admin.role === 'partner';
    const open = (vid, key, ts) => !feedbacks(vid, key).some(f => f.author === me2 && f.ts >= ts && (odoo || (J(f, {}) || {}).verdict));
    DB.ventures.forEach(v => {
      SIDS.forEach(s => { const b = get(v.id, 'brief', s); if (!b || (odoo && !/Odoo/.test(C.sessions[s].lead))) return; if (open(v.id, s, b.ts)) q.push({ v, label: s, name: C.sessions[s].brief.name, href: `#/v/${v.id}#b-${s}`, ts: b.ts }); });
      const p = get(v.id, 'plan', 'submission'); if (p && open(v.id, 'plan', p.ts)) q.push({ v, label: 'Plan', name: 'Business plan for quality review', href: `#/v/${v.id}/plan`, ts: p.ts, plan: true });
    });
    q.sort((a, z) => a.ts < z.ts ? -1 : 1);
    return `<section class="queue"><h2>Waiting for your feedback <span class="count mono">${q.length}</span></h2>
      ${q.length ? `<ul>${q.map(x => `<li${x.plan ? ' class="pl"' : ''}><a href="${x.href}"><span class="mono">${esc(x.label)}</span><strong>${esc(profile(x.v).venture)}</strong><span class="muted">${esc(x.name)}</span><span class="mono muted">${ago(x.ts)}</span></a></li>`).join('')}</ul>` : '<p class="muted">Nothing waiting.</p>'}</section>`;
  })() : '';

  const rows = DB.ventures.map(v => {
    const p = profile(v), t = traction(v.id).totals, f = focusShare(v.id);
    return `<tr><th scope="row"><a href="#/v/${v.id}">${esc(p.venture)}</a><small>${ago(lastActivity(v.id))}</small></th>
      <td>${movePill(J(get(v.id, 'move', 'move')))}</td><td>${ladderBar(ladderOf(v.id))}</td>
      <td class="fc">${splitBar(f)}<small class="mono${f && !onTarget(f) ? ' warn' : ''}">${f ? Math.round(f.u + f.p) + '%' : '—'}</small></td>
      <td class="mono tr" title="conversations · commitments · paying customers">${num(t.conversation)} · ${num(t.commitment)} · <b>${num(t.customer)}</b></td>
      ${SIDS.map(s => { const st = status(v.id, s); return `<td class="dc${s === cur ? ' cur' : ''}"><a class="dot ${st.cls}" href="#/v/${v.id}#b-${s}" aria-label="${s} ${esc(C.sessions[s].brief.name)}: ${st.t}" title="${s} · ${esc(C.sessions[s].brief.name)}: ${st.t}"></a></td>`; }).join('')}</tr>`;
  }).join('');
  const board = `<section><h2>The Lab</h2><div class="tbl"><table class="lab"><thead><tr><th scope="col">Venture</th><th scope="col">Move</th><th scope="col">Evidence</th><th scope="col">Focus</th><th scope="col">Traction</th>${SIDS.map(s => `<th scope="col" class="dc${s === cur ? ' cur' : ''}">${s.slice(1)}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${SIDS.length + 5}" class="muted">No ventures yet.</td></tr>`}</tbody></table></div>
    <div class="legend"><span><i class="dot s0"></i>open</span><span><i class="dot s1"></i>submitted</span><span><i class="dot s2"></i>revise</span><span><i class="dot s3"></i>accepted</span>
      <span>${ladderBar(3)} evidence step 3 of 5</span><span>${splitBar({ u: 50, p: 30, o: 20 })} hours on users · product · other, last 4 weeks (target ${C.focusTarget}%)</span><span>conversations · commitments · <b>paying</b></span></div></section>`;
  const tools = admin ? `<section class="card rtools"><div class="row between"><div><p class="eyebrow">Submissions and feedback</p>
      <p>${Object.keys(INFO.subs || {}).length} of ${DB.ventures.length} ventures imported${Object.values(INFO.subs || {}).length ? ` · latest file ${fmt(Object.values(INFO.subs).map(x => x.exported || x.imported).sort().pop())}` : ''}</p></div>
      <div class="row"><button class="btn small" data-act="importrev">Import logbook files</button>${admin.role === 'lecturer' ? `<button class="btn small${INFO.pending ? '' : ' ghost'}" data-act="publish">Publish feedback · download index.html</button><button class="btn ghost small" data-act="mergeupdate" title="Takes a new page version from Claude and adds all published feedback">Add feedback to a new page version</button>` : `<button class="btn small" data-act="exportfb">Export my comments</button>`}</div></div>
      <p class="muted small">${admin.role === 'lecturer'
        ? `Students e-mail you their logbook file; import those files here. Feedback and the current session reach students when you upload the downloaded index.html to GitHub.${INFO.pending ? ` <b>${INFO.pending} change(s) not yet published.</b>` : INFO.published ? ` Last published ${fmt(INFO.published)}.` : ''} Comments from Verena: import her feedback file with the same button.`
        : 'Import the logbook files you received, add your comments, then export your comments and send the file to Prof. Petzold. He publishes them with the next update.'}</p>${GUIDE_REVIEWER}</section>` : '';
  return head + tools + path + queue + board;
}

function fbBlock(vid, key, canGive, what) {
  const target = key === 'plan' ? get(vid, 'plan', 'submission') : get(vid, 'brief', key);

/* ---------- Business plan: material → own sections + financial plan → composed plan ---------- */
const PLAN_MIN = 300; // characters per own section (about 50 words)
const FIN = [
  ['cash0', 'Cash available at start (€)'], ['price', 'Price per customer or unit (€)'], ['varCost', 'Variable cost per customer or unit (€)'],
  ['units1', 'Customers or units in month 1'], ['growth', 'Growth per month (%)'], ['fixed', 'Fixed costs per month (€)'],
  ['draw', 'Founder salary per month (€)'], ['fund', 'External funding (€, 0 if none)'], ['fundMonth', 'Funding arrives in month (1–12)'],
  ['g2', 'Growth year 2 vs. year 1 (%)'], ['g3', 'Growth year 3 vs. year 2 (%)']];
const finInputs = vid => J(get(vid, 'finance', 'inputs'), {}) || {};
const finReady = f => FIN.every(([k]) => f[k] !== undefined && f[k] !== '');
function finance(f) {
  const n = k => +String(f[k] ?? 0).replace(',', '.') || 0;
  let cash = n('cash0'); const rows = [];
  for (let m = 1; m <= 12; m++) {
    const units = Math.round(n('units1') * Math.pow(1 + n('growth') / 100, m - 1));
    const rev = units * n('price'), vc = units * n('varCost'), op = rev - vc - n('fixed') - n('draw'), fund = m === Math.round(n('fundMonth')) ? n('fund') : 0;
    cash += op + fund; rows.push({ m, units, rev, vc, fixed: n('fixed'), draw: n('draw'), op, fund, cash });
  }
  const y1u = rows.reduce((a, r) => a + r.units, 0), years = [];
  [1, 1 + n('g2') / 100, (1 + n('g2') / 100) * (1 + n('g3') / 100)].forEach((g, i) => {
    const u = Math.round(y1u * g), rev = u * n('price'), gm = rev - u * n('varCost'), fix = 12 * (n('fixed') + n('draw'));
    years.push({ y: i + 1, u, rev, gm, fix, res: gm - fix });
  });
  const be = rows.find(r => r.op >= 0), low = rows.reduce((a, r) => r.cash < a.cash ? r : a, rows[0]);
  return { rows, years, breakEven: be ? be.m : null, low, end: rows[11].cash, alive: rows.every(r => r.cash >= 0) };
}

function financeText(f) {

        ...(odoo ? [] : [{ name: 'verdict', label: 'Verdict', options: [['revise', 'Revise'], ['ready', 'Accepted']], value: verdictOf(d.v, key)?.v }]),
        { name: 'text', label: odoo ? 'Comment' : 'Feedback', area: true, value: '' }], odoo ? 'Add comment' : 'Send feedback');
      if (r && r.text.trim() && await write('feedback', d.v, key, odoo ? { text: r.text.trim() } : { verdict: r.verdict, text: r.text.trim() })) { toast('Saved'); render(); }
      break;
    }
    case 'addtrac': await addTraction(vid, d.track, d.text); break;
    case 'deltrac': {
      const ent = J(get(vid, 'trac', d.key)); if (!ent) break;
      if (await write('trac', vid, d.key, { ...ent, deleted: true })) { toast('Removed'); render(); }
      break;
    }
    case 'week': {
      const w = isoWeek(), cur = J(get(vid, 'week', w)) || {};
      const r = await modal(`Founder hours · week ${w.slice(-2)}`, [
        { name: 'users', label: 'Getting users (talking, selling, onboarding)', type: 'number', value: cur.users ?? '' },
        { name: 'product', label: 'Building product (incl. Odoo set-up)', type: 'number', value: cur.product ?? '' },
        { name: 'other', label: 'Everything else (planning, admin, slides, polishing)', type: 'number', value: cur.other ?? '' }], 'Save hours',
        'Rough hours are enough. Be honest: the point is to see where your attention goes.');
      if (!r) break;
      const h = k => Math.max(0, parseFloat(String(r[k]).replace(',', '.')) || 0);
      if (await write('week', vid, w, { users: h('users'), product: h('product'), other: h('other') })) { toast('Hours saved'); render(); }
      break;
    }
    case 'submitplan': {
      const pe = get(vid, 'planpdf', 'pdf'), pdf = J(pe); if (!pdf) break;
      const r = await modal('Send plan for review', [], 'Send to reviewers', 'Your PDF goes into your logbook file. E-mail that file to Prof. Petzold; he and Verena Göttlich (Odoo) then see it. This is an optional extra service and does not count towards your grade.');
      if (!r) break;
      if (await write('plan', vid, 'submission', { pdfId: pdf.id, name: pdf.name })) { toast('Marked for review. Download your logbook file and e-mail it to Prof. Petzold.'); render(); }
      break;
    }
    case 'planwrite': writing.add(vid); render(); break;
    case 'dlbook': await downloadLogbook(); break;
    case 'ldbook': await loadLogbook(); break;
    case 'importrev': await importForReview(); break;
    case 'publish': await publish(); break;
    case 'mergeupdate': { const [f] = await pickFiles('.html,text/html'); if (f) await publish(await readText(f)); break; }
    case 'exportfb': await exportFeedback(); break;
    case 'compose': {
      if (await write('plandoc', vid, 'doc', { md: composePlan(vById(vid)), source: 'logbook' })) { writing.delete(vid); toast('Your business plan is ready'); go(`#/v/${vid}/plan`); }
      break;
    }
    case 'copyprompt': {
      const txt = PLAN_PROMPT + planDoc(vid).md.replace('[[FINANCE_TABLES]]', financeMD(finInputs(vid)));
      try { await navigator.clipboard.writeText(txt); toast('Copied. Paste it into Claude or another LLM.'); }
      catch { const ta = $('#promptbox'); if (ta) { ta.hidden = false; ta.value = txt; ta.select(); toast('Selected. Copy with Ctrl+C / ⌘C.'); } }
      break;
    }
    case 'uploadpdf': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/pdf,.pdf';
      inp.onchange = async () => {
        const file = inp.files[0]; if (!file) return;
        if (file.size > PDF_MAX) { toast(`The PDF is larger than ${PDF_MAX / 1048576} MB. Please compress it.`, true); return; }
        const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(file); });
        if (!data.startsWith('JVBER')) { toast('This is not a PDF file.', true); return; }
        toast('Uploading …');
        const res = await api({ action: 'upload', team: vid, code: me?.code || '', name: file.name, size: file.size, data });
        if (!res.ok) { toast(res.error || 'Upload failed', true); return; }
        DB.log.push({ ts: res.ts, team: vid, type: 'planpdf', key: 'pdf', value: JSON.stringify({ id: res.id, name: file.name, size: file.size }), author: 'Founder' }); index();
        toast('PDF uploaded'); render();
      };
      inp.click(); break;
    }
    case 'openpdf': {
      toast('Loading PDF …');
      const res = await api({ action: 'file', id: d.id, code: me?.code || '', adminKey: admin?.key || '' });
      if (!res.ok) { toast(res.error || 'Could not load the PDF', true); break; }
      const bin = atob(res.data), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u8], { type: 'application/pdf' }));
      const a = document.createElement('a'); a.href = url; a.download = d.name || 'business-plan.pdf'; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000); break;
    }
    case 'copyplan': {
      const doc = planDoc(vid), txt = doc ? doc.md.replace('[[FINANCE_TABLES]]', financeText(finInputs(vid))) : planText(vById(vid));
      try { await navigator.clipboard.writeText(txt); toast('Plan copied'); }
      catch { const r = document.createRange(); const el = $('#plan-doc'); if (el) { r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Plan selected. Copy with Ctrl+C / ⌘C.'); } }
      break;
    }
    case 'print': window.print(); break;
    case 'profile': await editProfile(vid); break;
    case 'move': {
      const cur = J(get(vid, 'move', 'move'), {}) || {};
      const r = await modal('Current move', [{ name: 'move', label: 'Move', options: C.moves.map(m => [m.id, m.label]), value: cur.move }, { name: 'note', label: 'Why (one sentence)', value: cur.note }]);
      if (r && await write('move', vid, 'move', { move: r.move, note: r.note.trim() })) { toast('Saved'); render(); }
      break;
    }
    case 'ladder': {
      const cur = get(vid, 'ladder', 'ladder')?.value;
      const r = await modal('Strongest evidence so far', [{ name: 'step', label: 'Evidence ladder', options: C.ladder.map((l, i) => [String(i + 1), l]), value: cur }]);
      if (r && await write('ladder', vid, 'ladder', r.step)) { toast('Saved'); render(); }
      break;
    }
    case 'logout': if (me) PUBFB[me.vid] = undefined; me = null; store.set('ecl-me', null); editing.clear(); DB = { ventures: [], log: DB.log.filter(e => e.team === '_course') }; index(); go('#/'); break;
  }
});
$('#adm').addEventListener('click', async () => {
  if (admin) { admin = null; CODES = null; store.set('ecl-admin', null, true); go('#/'); await load(); return; }
  const r = await modal('Reviewer access', [{ name: 'k', label: 'Key', type: 'password' }], 'Sign in'); if (!r) return;
  const res = await api({ action: 'check', adminKey: r.k });
  if (res.role) { admin = { key: r.k, role: res.role }; store.set('ecl-admin', admin, true); toast(`Signed in as ${ROLE_NAME[res.role]}`); go('#/'); await load(); } else toast('Key not valid', true);
});
async function editProfile(vid, first) {
  const p = profile(vById(vid));
  const r = await modal(first ? 'Name your venture' : 'Venture', [{ name: 'venture', label: 'Venture name', value: first ? '' : p.venture }, { name: 'oneLiner', label: 'One-liner: who you help with what', area: true, value: p.oneLiner }],
    'Save', first ? 'Welcome to your Unicorn Logbook. Give your venture a working name; you can change it any time.' : '');
  if (r && (r.venture.trim() || r.oneLiner.trim()) && await write('profile', vid, 'profile', { venture: r.venture.trim() || p.venture, oneLiner: r.oneLiner.trim() })) { toast('Saved'); render(); }
}
// Sandboxed frames (e.g. previews) block native form submission: submit forms via a synthetic event instead.
const fakeSubmit = form => form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
document.addEventListener('click', e => { const btn = e.target.closest('form button:not([type=button])'); if (!btn || btn.dataset.act) return; e.preventDefault(); fakeSubmit(btn.form); }, true);
document.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || !e.target.form) return; e.preventDefault(); fakeSubmit(e.target.form); }, true);
document.addEventListener('submit', async e => {
  if (e.target.id !== 'codeform') return;
  e.preventDefault();
  const code = e.target.code.value;
  if (!norm(code)) { toast('Enter your access code.', true); return; }
  const res = await api({ action: 'check', code });
  if (!res.venture) { toast('This code does not match any venture. Check for typos.', true); return; }
  me = { vid: res.venture, code: code.trim() }; store.set('ecl-me', me); go('#/'); await load();
  if (!get(me.vid, 'profile', 'profile')) editProfile(me.vid, true); else toast('Welcome back');
});
window.addEventListener('hashchange', () => { if (location.hash && location.hash !== HASH) go(location.hash); });
document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (!a || e.defaultPrevented) return; e.preventDefault(); go(a.getAttribute('href')); }, true);
window.__ecl = { write, SIDS, C }; // test hook
load().then(() => { const a = HASH.split('#')[2]; if (a) document.getElementById(a)?.scrollIntoView({ block: 'start' }); });
})();

</script>
